name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# softprops/action-gh-release needs to write the draft release. Without this,
# GITHUB_TOKEN is read-only and release creation fails with "Resource not
# accessible by integration".
permissions:
  contents: write

jobs:
  check:
    name: Test and lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Verify formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      - name: Release tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)"
          tag="${GITHUB_REF_NAME#v}"
          if [[ "$version" != "$tag" ]]; then
            echo "Tag v$tag does not match Cargo.toml version $version" >&2
            exit 1
          fi

  bundle:
    name: Bundle
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            file \
            fuse

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # One job builds every artifact once. A matrix here compiled the same
      # binary per target and each job then produced all bundles, because the
      # per-job `--bundles` was never passed through.
      - name: Build bundles
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: .
          args: --bundles deb,rpm,appimage

      - name: Collect release files
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p upload
          cp target/release/onenote-linux upload/onenote-linux
          find target/release/bundle -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec cp {} upload/ \;

      - name: Checksums
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: upload
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onenote-linux
          path: |
            target/release/onenote-linux
            target/release/bundle/**
          if-no-files-found: warn
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ format('OneNote {0}', github.ref_name) }}
          draft: true
          prerelease: false
          files: upload/*
          body: |
            Unofficial Microsoft OneNote client for Linux.

            Not affiliated with Microsoft. This is a wrapper around the
            OneNote web client and requires a Microsoft 365 account.

            The plain `onenote-linux` binary is what `install.sh` fetches; it
            is built for x86_64 and expects the system WebKitGTK/GTK packages.
            `SHA256SUMS` covers every other file in this release.
