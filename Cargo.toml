[package]
name = "onenote-linux"
version = "0.1.0"
description = "Unofficial Microsoft OneNote desktop client for Linux"
license = "MIT"
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
# Queries Microsoft's tenant UserRealm endpoint to discover an organisation's
# federation endpoint during first-run setup. TLS roots come from the system
# store, so corporate CAs installed in /etc/ssl are trusted.
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "rustls",
  "system-proxy",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
